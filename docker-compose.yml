services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sisodij-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - EFIRMA_PORTAL_URL=${EFIRMA_PORTAL_URL}
      - EFIRMA_PROJECT_TOKEN=${EFIRMA_PROJECT_TOKEN}
      - EFIRMA_BYPASS=${EFIRMA_BYPASS:-false}
      - SIGEF_WS_URL=${SIGEF_WS_URL}
      - SIGEF_APP_ID=${SIGEF_APP_ID}
      - SIGEF_TIMEOUT_MS=${SIGEF_TIMEOUT_MS:-10000}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: sisodij-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sisodij}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sisodij}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sisodij} -d ${POSTGRES_DB:-sisodij}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
